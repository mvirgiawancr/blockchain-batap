version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./fablo-target:/fablo-target
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - accreditation-network
      - fablo-target_basic  # Connect to Fabric network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - accreditation-network
    depends_on:
      - backend

networks:
  accreditation-network:
    driver: bridge
  fablo-target_basic:
    external: true
