version: '3.8'

services:
  backend:
    build:
      context: ./backend-express
      dockerfile: Dockerfile
    container_name: lamtek-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend-express/.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./fablo-target:/app/fablo-target:ro
      - backend-wallet:/app/wallet
      - backend-logs:/app/logs
    networks:
      - accreditation-network
      - fablo-target_basic
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: lamtek-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - accreditation-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend-wallet:
    driver: local
  backend-logs:
    driver: local

networks:
  accreditation-network:
    driver: bridge
  fablo-target_basic:
    external: true
