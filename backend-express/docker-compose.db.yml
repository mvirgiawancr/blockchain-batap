version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-akreditasi
    environment:
      POSTGRES_DB: akreditasi
      POSTGRES_USER: lamtek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lamtek_secure_2025}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamtek -d akreditasi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GUI web untuk melihat & mengedit database (mirip SQLyog) — buka http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: adminer-akreditasi
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
